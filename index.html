    * { box-sizing: border-box; }
    body {

    .cta {
      display: inline-block;

      color: var(--brand);
      background: transparent;
      border-radius: 8px;
      text-decoration: none;
      transition: background .2s ease, color .2s ease;

    .cta.primary { background: var(--brand); color: #000; }
